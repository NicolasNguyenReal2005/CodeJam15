<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NOBUL</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="header-row">
  <div class="header-text">
    <h1>NOBUL</h1>
    <p class="subtitle">Analyze text for fallacies & credibility.</p>
  </div>
  <img
    src="NOBUL-Knight-Avatar.png"
    alt="NOBUL avatar"
    class="nobul-avatar"
  />
</div>


    <div class="mode-switch">
  <label class="mode-option">
    <input type="radio" name="mode" value="text" checked />
    <span>Text</span>
  </label>

  <label class="mode-option">
    <input type="radio" name="mode" value="ScanText" />
    <span>Scan Text</span>
  </label>
</div>


    <textarea id="inputField" placeholder="Paste or Scan Text here..." rows="5"></textarea>

    <button id="analyzeBtn">Analyze</button>

    <div id="status" class="status"></div>

    <div id="results" class="results"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
