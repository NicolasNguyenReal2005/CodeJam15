<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NOBUL</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <h1>NOBUL</h1>
    <p class="subtitle">Analyze text or YouTube links for fallacies & credibility.</p>

    <div class="mode-switch">
      <label>
        <input type="radio" name="mode" value="text" checked />
        Text
      </label>
      <label>
        <input type="radio" name="mode" value="youtube" />
        YouTube Link
      </label>
    </div>

    <div style="margin:8px 0;display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="useSelectionToggle" checked/>
      <label for="useSelectionToggle" style="font-size:13px;">Use page selection</label>
    </div>

    <textarea id="inputField" placeholder="Paste text or YouTube URL here..." rows="5"></textarea>

    <div style="display:flex;gap:8px;align-items:center;">
      <button id="analyzeBtn" class="analyze-btn">Analyze</button>
      <button id="scrapeBtn" class="secondary-btn">Use current page</button>
    </div>

    <div id="status" class="status"></div>

    <div id="results" class="results"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
